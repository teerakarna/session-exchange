name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR cancels whatever run was still going for that same ref - never for main, where
# every push is a merge that should run to completion and be individually visible.
#
# `github.run_id` in the group key for anything that is not a pull_request, rather than a plain
# `ci-${{ github.ref }}`: GitHub cancels a run that is still *queued* the moment another run joins
# the same group, regardless of `cancel-in-progress`, which only protects a run that has already
# started. Shared across every push to main, three pushes in quick succession would silently drop the
# middle one's queued run, breaking the "individually visible" guarantee this block exists to make.
# `run_id` is unique per run, so each push gets a group of one and only PR runs actually share.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The suite is the only gate this repo has, so it runs on every Python version the plugin can land
  # on. Until this existed, "156 checks green" meant one machine, one interpreter, once, at whatever
  # moment someone remembered to type it.
  #
  # Spelt as `include` rather than a matrix with an `exclude` because the four legs are not a product
  # with a hole in it, they are four deliberate choices:
  #
  # - 3.9 is the floor. The hooks invoke whatever `python3` is on PATH, and on a stock macOS that is
  #   the system 3.9. Ubuntu only, because setup-python has no arm64 build that far back.
  # - 3.11 and 3.13 cover the interpreter-level behaviour, which is where the version sensitivity is.
  # - One macOS leg, on 3.13. The platform-sensitive parts are `os.kill` and `ps`, and those do not
  #   vary by interpreter version, so a second macOS leg asserted nothing the first one did not - and
  #   macOS minutes bill at 10x, so it was two thirds of this workflow's entire cost. The other
  #   direction (drop macOS from PRs, run the full matrix only on push to main) was rejected: it makes
  #   the PR gate weaker than the main gate, and a gate that is not the thing it is protecting is the
  #   failure mode this repo exists about.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # No install step, and that is the point: see the stdlib step in `checks`.
      - name: Test
        run: python plugin/tests/run.py

  # Four jobs merged into one. Every job bills a minimum of one whole minute regardless of how little
  # it runs, and these four took six, eight, nine and eighteen seconds, so four jobs was a four-minute
  # floor to do half a minute of work. Same checks, same order of failure, one runner, one checkout.
  #
  # `secrets` deliberately stays split out rather than becoming a fifth step here: it needs
  # `pull-requests: write` so gitleaks can comment on a find, and giving every step below that same
  # write permission - including an unpinned global npm install - to save one more minute would trade
  # least privilege for a rounding error.
  #
  # Ordered cheapest-setup first so the common failure surfaces soonest: shellcheck is preinstalled,
  # the two Python steps share one interpreter setup, and the Node install goes last because it is
  # three quarters of the job's wall time. loom orders its equivalent the other way, to keep an
  # unpinned npm install off a runner with populated build caches - there is nothing comparable on
  # this runner to reach, and `persist-credentials: false` above means there is no token on it either.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false

      # Every step from here on carries `if: *gate`, defined once as `&gate` below and aliased after.
      # A step with no `if:` line is visibly missing something; six hand-copied conditions, one of
      # them subtly wrong, would not be. If you add a step, it needs the alias too, or that step
      # reverts to default `success()` semantics and stops reporting independently.
      #
      # `!cancelled()` alone is not enough: it is true whenever the job was not cancelled, which says
      # nothing about whether the checkout worked. A checkout that fails for its own reason would
      # leave every later step running against a workspace that was never populated, turning one
      # clean failure into five confusing ones. The explicit outcome check is the hard gate;
      # `!cancelled()` is what lets the rest fail independently of each other - not `always()`, which
      # would also run them through a genuine cancellation, spending exactly the minutes the
      # concurrency group above exists to save.
      #
      # Two shell scripts, and they are the entry point for everything else: if a handler is wrong,
      # nothing downstream of it runs and the plugin looks installed and inert.
      - name: ShellCheck the hook handlers
        if: &gate ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: shellcheck plugin/hooks-handlers/*.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: *gate
        with:
          python-version: "3.13"

      # The plugin runs as a hook against whatever `python3` the machine has, with no virtualenv and
      # no opportunity to pip install anything. A third-party import is therefore not a dependency
      # decision, it is a hook that raises ImportError at session start on every machine but the
      # author's. Gated rather than documented, because a convention nothing checks is a convention
      # already broken.
      - name: Assert the runtime imports nothing but the standard library
        if: *gate
        run: |
          python - <<'EOF'
          import ast, pathlib, sys

          # The lib modules import each other by bare name, because the handlers put that directory
          # on sys.path rather than installing anything.
          local = {p.stem for p in pathlib.Path("plugin/lib").glob("*.py")}
          bad = []
          for path in sorted(pathlib.Path("plugin/lib").rglob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [alias.name for alias in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      names = [node.module or ""]
                  else:
                      continue
                  for name in names:
                      root = name.split(".")[0]
                      if root and root not in sys.stdlib_module_names and root not in local:
                          bad.append(f"{path}: {name}")
          if bad:
              print("Third-party imports in the runtime:")
              print("\n".join(f"  {line}" for line in bad))
              sys.exit(1)
          print(f"clean: {len(local)} local modules, standard library only")
          EOF

      # Pinned, because an unpinned linter turns somebody else's release into a red build on a branch
      # that changed nothing. The pin lives in a requirements file rather than inline so dependabot
      # can bump it in a PR with the diff visible.
      - name: Install ruff
        if: *gate
        run: python -m pip install -r .github/requirements-ci.txt

      - name: Lint
        if: *gate
        run: ruff check .

      - name: Format
        if: *gate
        run: ruff format --check .

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: *gate
        with:
          node-version: "22"

      # The repo's own layout test asserts the shape this project believes in. This asserts the shape
      # the runtime believes in, which is the one that decides whether the plugin loads at all, and it
      # tracks upstream when the manifest schema moves. `--strict` is documented for exactly this: it
      # fails on unrecognised fields and missing metadata the runtime would otherwise tolerate
      # quietly. Deliberately unpinned, unlike every action here - pinning would freeze the schema
      # this is checked against, and catching "the format moved and ours no longer conforms" is the
      # whole reason the step exists.
      #
      # Both manifests, because they are separate files with separate schemas and a marketplace that
      # validates says nothing about the plugin it points at.
      - name: Validate the plugin and marketplace manifests
        if: *gate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict ./plugin
          claude plugin validate --strict .

  # Breaks one rule at a time and requires the suite to notice. `test` answers "does the suite pass";
  # this answers "would it have failed if the code were wrong", which is the only question this repo
  # treats as load-bearing and the one a green suite cannot address.
  #
  # Its own job rather than a step in `checks`, which the cost rule in CONTRIBUTING.md would otherwise
  # say. Three reasons, and the arithmetic was measured rather than assumed. It runs the full suite
  # once per mutation, plus the baseline - a hundred and forty-five runs and eight and a half minutes
  # locally for the eight tables there are now - so as a step it would sit behind or in front
  # of a lint that takes under a second, and either order is wrong: last means slow feedback on a typo,
  # first means the cheap checks wait on it. Its failure is also categorically different from any other
  # step's, naming a rule nothing asserts rather than a rule broken, and merging it in would report
  # that as "checks failed".
  #
  # What it is not is free, and the first version of this comment claimed it was. `checks` comes in
  # between fifteen and thirty seconds and the sweep between one and one and a half minutes, so a
  # separate job bills 1 + 2 while folding the sweep in bills 2: the split costs one Linux minute per
  # run, and goes on doing so for any `checks` under about fifty seconds. That is the price of the two
  # reasons above rather than an argument for them. Stated as a range because the first version of
  # this paragraph named one measurement of `checks` and the next CI run came in at half of it, which
  # did not change the conclusion but is how the claim would have rotted.
  #
  # And the narrowing below makes that price worse rather than better, which is worth saying plainly:
  # most runs now sweep one module or none, so this job usually finishes well inside a minute, and the
  # split bills its extra Linux minute on nearly every run instead of on some. The two reasons above
  # are what is being bought, at a rate that went up. Linux minutes are the cheap ones and the macOS
  # leg in `test` still costs more than this job does in a month.
  #
  # One interpreter, one OS. The sweep asserts what the suite asserts, which does not vary by Python
  # version - `test` is where version sensitivity belongs, and a matrix here would multiply those
  # suite runs by four for no additional answer.
  #
  # Narrowed to what the change could have broken, rather than every table, and that is the one tier
  # in this workflow. A sweep is one full suite run per mutation, so its cost is the mutation count
  # times the length of the suite: eight modules is 144 mutations and eight and a half minutes locally,
  # where six was just over four, and nine is 191 and sixteen and a half. That is already past what a
  # push should carry to re-answer a question the last push answered about code it did not touch, and
  # every table added makes it worse. Nothing else here grows that way, which is why nothing else here
  # is tiered - the matrix is four fixed legs, and making the PR gate weaker than the main gate is the
  # failure mode this repo is about.
  #
  # This comment said "linear in the size of the tables" for four tables' worth of history, and the
  # measurements below are what corrected it. Both halves of the product grow, because a table brings
  # its own test file and every mutation already in the tables then runs those checks too.
  #
  # The runner figure this comment used to carry was "between four and a half and four and three
  # quarters", and the correction is about the range rather than the number. Four full resweeps of the
  # 87-mutation set came in at 3:02, 4:26, 4:40 and 4:57, so the spread is more like three to five
  # minutes and a quarter-minute range was never supported by them - it was the tightest reading of
  # three samples that happened to cluster.
  #
  # The figures for the eight tables are measurements rather than a range or a scaling. Two full
  # resweeps on the branch that filled them: 7m50s for 135 mutations, then 7m32s for all 138 (job
  # totals 7m55s and 7m41s, run 36281802966). Scaling 1.55x off the range above would have been
  # arithmetic dressed as a measurement, and it would have landed near enough to look right for the
  # wrong reason. The tables have since grown to 144, measured at 8m24s locally; the runner figures
  # above are still the 138 ones and are labelled with the count they were taken at, because a figure
  # that quietly re-labels itself as the tables grow is the thing this paragraph exists to stop.
  #
  # Nine tables is 178 mutations, and 14m51s locally is the figure at 177 - one short, and labelled
  # that way for the reason the paragraph above gives. Scaling the 144 figure would have said ten and
  # a half, and the gap is the more useful half of the measurement: a sweep costs mutations times
  # suite length, not mutations. The ninth table added 32 mutations and also added a test file and
  # nineteen subprocess-spawning checks to the suite that all of them then run, so per-mutation cost
  # went from 3.5s to 5.0s and every existing table got slower. Each table added is therefore worse
  # than linear.
  #
  # 16m30s at 191 mutations is the most recent full resweep, on the #50 branch. The sweep prints its
  # own per-mutation figure from #43 onwards, so the next correction to this paragraph comes off a log
  # line rather than off someone dividing a job total by a count read out of the summary.
  #
  # That one is a laptop, and so is every figure above it except the runner paragraphs that say so.
  # This job swept 191 in 1244s, 6.5s each, on run 36395773935, and then 191 in 1028s, 5.4s each, on
  # 36399785524 - two commits apart, the second with the longer suite. Which is the whole lesson and
  # not the two numbers: the runner's own spread is a fifth, it brackets every local figure taken at
  # this count, and the first reading of this pair said the machine was worth half a second and the
  # added checks the rest. That was a difference of two samples read as two causes, which is the same
  # mistake the "four and a half to four and three quarters" paragraph above records. Nothing here
  # supports attributing a per-mutation figure to anything, so the limit below is sized off the
  # slowest full resweep observed rather than the latest, and a laptop figure is not a candidate at
  # all: 15 minutes came from one, against a sweep that then ran to 15m15s and was canceled.
  #
  # And the narrowing did not narrow anything until #36, which is the change worth knowing about here
  # rather than any of the figures. The tables lived in `mutate.py`, `mutate.py` is instrument, and the
  # rule in this repo is that a fix adds a mutation, so nearly every push tripped the wide path and
  # paid the full sweep. The tables are `plugin/tests/tables/<module>.py` now, one file each so the
  # path says which module a new mutation belongs to, and the figures above are what a push pays only
  # when it changes something wide: the harness, what a table entry is, which tables exist, or
  # `test_cli.py`. That is the same list the timeout paragraph below gives, and it is deliberately not
  # "when the harness itself changes", which is what this said first and is narrower than the code.
  #
  # Read the step duration, not the first log line. The 138 run printed its `sweeping ...` line four
  # minutes in, which is stdout block-buffering flushing rather than the sweep starting late, and taking
  # it at face value would have made the sweep look like half its cost with four minutes of setup in
  # front of it. Setup is six seconds: checkout two, `setup-python` under one, the rest is the sweep.
  #
  # The narrowing is in `mutate.py --since`, not in this file, so the same command is the local one.
  # `targets` there derives the module list, and it is wider than "the lib files that changed": a test
  # file maps to the modules its checks catch, because a deleted check is how a mutation stops being
  # caught, a change to the harness, to what a table entry is or to which tables exist resweeps
  # everything, and so does a change to `test_cli.py`, which catches across every module while being
  # no mutation's `caught_by` (#27).
  #
  # Still unconditional, and it has to be: `ci` reads a `skipped` need as failure, so a job with an
  # `if:` on it would block `main` on every run where the condition was false. A change with nothing
  # to sweep exits 0 with a printed reason instead, which is a job that ran and said so.
  #
  # The full sweep lives in `sweep.yml`, weekly, where the length of it does not matter.
  #
  # Which is why the limit below is `sweep.yml`'s number and not a smaller one sized for the narrow
  # case. The narrowing is not a bound: a change to the harness, to what a table entry is, to which
  # tables exist, or to `test_cli.py` widens it to every table - the same four the paragraph above
  # gives, spelled out again because writing three of them here is what review caught - so this job
  # runs the weekly sweep several times a quarter
  # and has to be able to finish it. #36 made that rarer, not impossible, and a limit sized for the
  # common case fails on exactly the PRs that most need the wide sweep to be believed.
  # Sizing it for the common case instead cost a day here. At 15 minutes against a 14m51s sweep, the
  # first PR to touch the harness after the ninth table was added got `The operation was canceled` at
  # 15m15s, which arrives as a red `mutate` and takes the `ci` aggregate with it - indistinguishable
  # at a glance from a survived mutation, and the log's last line before the cancel was an `ok`. A
  # timeout that trips on a passing sweep does not report a slow job, it reports a broken rule that
  # is not broken, and it made a harness change unmergeable rather than slow.
  #
  # So: the two numbers are the same by construction. If the full sweep outgrows 45 minutes, both
  # move together, and the one to raise first is this one.
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `--since` needs a merge base, which a depth-1 clone does not have.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # `base.sha` on a PR, and it is the base rather than `HEAD^` because the checkout is a merge
      # commit: `HEAD^` there is the tip of `main`, so a PR of six commits would sweep only what the
      # last one touched. On a push to `main`, `event.before` is the previous tip, which after a squash
      # merge is exactly one commit back.
      #
      # If that ref is ever unreachable - a force push to `main`, which the ruleset forbids -
      # `mutate.py` refuses with exit 2 rather than reporting an empty diff as nothing to sweep. The
      # recovery is a manual run of the `Sweep` workflow, not a change here.
      - name: Sweep what this change could have broken
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python plugin/tests/mutate.py --since "$BASE"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action posts a PR comment when it finds a leak.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # scans full history, not just the working tree

      # This tool was designed against a real multi-session environment and is deliberately generic:
      # nothing here names a path, a lane, a repo or a person. Secret scanning is the cheap half of
      # keeping it that way.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The single check branch protection requires, and the only reason this job exists. Requiring the
  # other jobs by name means every matrix leg is named in a repo setting: rename one, or drop a
  # Python version, and `main` is blocked forever waiting on a check that will never report again.
  # A stuck gate gets bypassed, and a bypassed gate is worse than none, which is the failure this
  # whole repo is about. One aggregate name is stable across any change to the matrix.
  #
  # `always()` so it runs even when something upstream failed, and the explicit result check because
  # a skipped `needs` job does not fail a dependant on its own.
  ci:
    needs: [test, checks, mutate, secrets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The list above is the one gate that guards every other gate: `ci` is the only check the
      # ruleset names, and it fails only if a job in its `needs` failed. A job left out of that list
      # still runs, still reports and still goes red on the PR, while the merge button stays green.
      # The check exists, it is visibly running, and it is gating nothing. Eleven jobs and four
      # consolidations kept the list by hand.
      #
      # In `ci` rather than as a step in `checks`, which is where the cost rule in CONTRIBUTING.md
      # would otherwise put it and where it was first written. From inside `checks` the one omission
      # it cannot catch is `checks` itself: drop that name and the step goes red, correctly, while
      # `checks` is no longer required, the other three jobs succeed, and `ci` goes green with the
      # merge button. A check that exempts the job it runs in is the shape it exists to close. Here it
      # costs no extra billed job - `ci` is already a minute's floor doing a second of work.
      #
      # Only the direction that bites: every job has to be in `needs`. A name in `needs` that is not a
      # job is a hard Actions error already, so checking that way round adds nothing.
      #
      # There is no exemption mechanism, deliberately, and it forbids one thing: a job that runs
      # conditionally. Out of `needs` and this step fails; in `needs` and the loop below reads
      # `skipped` as failure on every run where the condition is false. If that is ever wanted, the
      # loop and this step have to change together, which is a design decision rather than a list
      # edit, and this is what will make somebody notice it is one.
      # Same independent-reporting pattern as `checks`, and the same reasoning, but written out rather
      # than sharing that job's anchor: the aggregate step below must report whatever else in here
      # went wrong, or a failed checkout would skip it and leave `ci` green having checked nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          python-version: "3.13"

      - name: Assert every job is in ci's needs
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          python -m pip install -r .github/requirements-ci.txt
          python - <<'EOF'
          import sys

          import yaml

          # A real parser, because the workflow uses a YAML anchor for the step conditions in
          # `checks` and anything regex-shaped would have to guess at the file Actions actually reads.
          jobs = yaml.safe_load(open(".github/workflows/ci.yml", encoding="utf-8"))["jobs"]
          needs = jobs["ci"].get("needs") or []
          if isinstance(needs, str):
              needs = [needs]
          missing = [name for name in jobs if name != "ci" and name not in needs]
          if missing:
              for name in missing:
                  print(f"::error::job '{name}' is not in ci's needs, so it gates nothing")
              sys.exit(1)
          print(f"ci needs all {len(needs)} other job(s): {', '.join(sorted(needs))}")
          EOF

      - name: Fail unless every job succeeded
        if: ${{ !cancelled() }}
        run: |
          # Single quotes inside the expression, double outside: a GitHub expression only accepts
          # single-quoted strings, and `" "` there is not a syntax error YAML can see. It parses
          # fine and Actions rejects the whole file, so every job vanishes rather than one failing.
          results="${{ join(needs.*.result, ' ') }}"
          echo "upstream: $results"
          # An empty list would pass the loop below without checking anything, which is the exact
          # shape of gate this repo exists to stop shipping. It should be unreachable.
          if [ -z "$results" ]; then
            echo "::error::no upstream results to check, so this gate proved nothing"
            exit 1
          fi
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed"
              exit 1
            fi
          done
