version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # CI tooling only. There is no pip entry for the project itself because there is no project
  # dependency: the runtime imports the standard library and nothing else, and the `stdlib` job in
  # ci.yml fails the build if that ever stops being true.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
